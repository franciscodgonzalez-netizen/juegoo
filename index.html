function start(){S={...S,lv:1,score:0,combo:0,hp:4,silent:false};lvl()}
function lvl(){const base=CS[CI%CS.length],need=base.need||R(["Gaming","Oficina","Edición de video"]);S.cu={...base,need,budget:Math.round((450+Math.random()*(1500+S.lv*250))/50)*50};S.mood="neutral";S.silent=false;I=.3;S.ph="intro";draw();sfx("door")}
function build(){const sk=R(Object.keys(SK)),mb=SK[sk];S.sk=sk;S.mb=mb;S.step=0;S.placed={};S.pmax=Math.max(50,85-S.lv*2);S.pat=S.pmax;S.bad=0;
S.tr={cpu:sh([...sh(CPU.filter(x=>x[1]==sk)).slice(0,2).map(x=>pj(x,1)),...sh(CPU.filter(x=>x[1]!=sk)).slice(0,2).map(x=>pj(x,0,`¡Socket ${x[1]} ≠ ${sk}! `+(brand(x[0])!=mb.br?`Un ${brand(x[0])} no entra en una placa ${mb.br}.`:"Mismo fabricante, pero distinto zócalo.")))]),
cool:sh(COOL).slice(0,3).map(x=>pj(x,1)),
ram:sh([...sh(RAM.filter(x=>x[1]==mb.d)).slice(0,2).map(x=>pj(x,1)),...sh(RAM.filter(x=>x[1]!=mb.d)).slice(0,2).map(x=>pj(x,0,`La placa usa ${mb.d} y esa RAM es ${x[1]}: la muesca no coincide.`))]),
ssd:sh([...sh(SSD).slice(0,3).map(x=>pj(x,1)),pj(["Disco IDE 40 GB","IDE",0,15],0,"¡IDE es de 1998! La placa solo tiene SATA y M.2.")]),
gpu:sh([...sh(GPU).slice(0,3).map(x=>pj(x,1)),pj(["Tarjeta AGP 2001","AGP",0,20],0,"¡El slot AGP ya no existe! Necesitás PCIe.")])};
S.msg=`Placa <b>${mb.b}</b>: zócalo <b>${sk}</b> (${mb.br}), memoria <b>${mb.d}</b>. Primero: procesador.`;S.ph="build";I=.4;draw();clearInterval(S.tm);S.tm=setInterval(tick,100)}
function tick(){if(S.ph!="build"&&S.ph!="maint")return;S.pat-=.1;const v=Q("#vr");if(v){v.dataset.l--;if(v.dataset.l<=0){v.remove();S.combo=0;if(hit()){bang("El virus borró el BIOS y tomó el control.","robot");return}S.msg="🦠 El virus te quemó un fusible ⚡";S.bad=1;draw()}}else if(Math.random()<.006&&S.pat>10)virus();I=Math.min(1,.3+S.combo*.12+(S.pat<10?.3:0));const b=Q("#pb i");if(b)b.style.width=Math.max(0,S.pat/S.pmax*100)+"%";if(S.pat<=0){clearInterval(S.tm);bang("¡Me cansé de esperar! Tardaste una eternidad.")}}
function place(i,x,y){const k=ST[S.step][0],p=S.tr[k][i];
if(!p.ok){sfx("bad");p.rej=1;S.combo=0;S.pat-=4;S.msg="💥 CORTOCIRCUITO (−1 fusible): "+p.why+" (−4 s)";S.bad=1;if(hit())return;draw();Q(".board").classList.add("shake");burst(x,y,["💥","⚠️"],5);return}
sfx("boing");setTimeout(()=>sfx("ok"),120);S.combo++;S.placed[k]=p;const pts=10*S.combo;S.score+=pts;burst(x,y,["✨","⚡","💾","🪙"],9);flash("#00ff9c");S.step++;S.bad=0;S.last=k;
if(S.step>=5){S.msg="¡Todo instalado! Ahora <b>mantenimiento</b>: soplá el polvo y ajustá los tornillos 🔧";S.ph="maint";S.items=[...Array(4)].map(()=>({t:"dust",x:8+Math.random()*80,y:10+Math.random()*75})).concat([[6,6],[88,6],[6,86],[88,86]].map(a=>({t:"screw",x:a[0],y:a[1]})))}
else S.msg=`✅ ${p.n} instalado (+${pts}${S.combo>1?" · COMBO x"+S.combo:""}). Ahora: <b>${ST[S.step][1]}</b>.`;draw()}
function clean(i,e){const it=S.items[i];if(!it)return;S.items[i]=null;sfx("coin");S.score+=5;burst(e.clientX,e.clientY,it.t=="dust"?["💨","✨"]:["🔩","✨"],5);e.target.remove();if(!S.items.some(x=>x)){clearInterval(S.tm);arrive()}}

function hintTxt(){const p=S.price,w=S.wtp;return p<=w*.8?"😍 ¡Casi regalada!":p<=w?"😊 Buen precio":p<=w*1.35?"😐 Medio caro… va a regatear":"😡 ¡Se va a enojar!"}

function cost(){return Object.values(S.placed).reduce((a,p)=>a+p.v,0)}
function arrive(){rmV();if(cost()>S.cu.budget*1.25)return bang("¡Esta PC vale más que todo mi presupuesto!");const c=S.cu,w=NEEDS[c.need],p=S.placed;let s=0;for(const k in w)s+=w[k]*p[k].t/4*10;if(p.cpu.t>=3&&p.cool.t<2)s-=1.5;S.sat=Math.max(1,Math.min(10,s));S.wtp=Math.min(c.budget*1.25,cost()*(1.15+S.sat/10*.6));S.price=Math.round(cost()*1.25);S.counter=0;S.bonus=Math.round(S.pat*4);S.score+=S.bonus;S.mood="neutral";S.ph="sell";S.silent=false;I=.3;S.msg=`${talk(c,"s")}`;burst(innerWidth/2,200,["🎉","⭐"],10);sfx("coin");draw()}
function offer(){if(S.price<=S.wtp)return sold(S.price);if(S.price<=S.wtp*1.35){S.counter=Math.round(S.wtp);S.msg=`Mmm, está medio cara… Te doy <b>${$(S.counter)}</b>. ¿Cerramos?`;draw()}else bang("¡Ese precio es una estafa!")}
function sold(pr){if(S.sat<3)return bang("¡Esta PC no rinde para lo que necesito!");const pf=pr-cost();S.score+=Math.max(0,pf);S.hp=Math.min(4,S.hp+1);S.res={pf,cheap:pr<S.wtp*.75};S.mood="happy";S.ph="res";sfx("coin");flash("#ffe600");draw();burst(innerWidth/2,260,["💰","🪙","💖","⭐"],14)}
function bang(t,kind){CI++;clearInterval(S.tm);rmV();S.mood="gun";S.bt=t;S.kind=kind||R(["gun","gun","boom","ufo","robot"]);S.ph="bang";S.silent=true;setTimeout(()=>{if(S.ph=="bang")sfx("boom")},1600);setTimeout(()=>{if(S.ph=="bang"){sfx("bang");flash("#fff")}},4400);flash("#ff2d2d");try{if(S.score>S.best){S.best=S.score;localStorage.setItem("v500",S.best)}}catch(e){}draw()}

h=hud()+`<div class="bar" id="pb"><i style="width:${S.pat/S.pmax*100}%"></i></div><div class="row"><div class="bob">${face(c,"neutral").replace(/width:170px/,"width:95px")}</div><div class="bub">${c.need} · Presupuesto ${$(c.budget)}<br><small>Costo actual: <b style="color:${cost()>c.budget*1.25?'#ff2d95':'#0a8a4a'}">${$(cost())}</b> · cada error quema un fusible ⚡<br>💡 ${needTip(c.need)}</small></div></div>
<div class="msg ${S.bad?"bad":""}">${S.msg}</div><div class="board">${ST.map(([id,l,cl],i)=>`<div class="slot ${cl} ${i==S.step&&S.ph=="build"?"cur":""}" data-k="${id}">${S.placed[id]?`<div class="${S.last==id&&S.ph=="build"?"land":""}">${icon(id,S.placed[id])}</div>${S.placed[id].n}`:(i==S.step?"▶ ":"")+l}</div>`).join("")}${S.ph=="maint"?S.items.map((it,i)=>it?`<div class="${it.t}" style="left:${it.x}%;top:${it.y}%;animation-delay:${i*.13}s" onpointerdown="clean(${i},event)"></div>`:"").join(""):""}</div>`+(S.ph=="build"?`<div style="margin:8px 0;font-weight:800;color:var(--yl)">Arrastrá: ${ST[S.step][1]} ⬇ <small style="color:#fff">· ${stepHint()}</small></div><div class="shelf">${S.tr[k].map((p,i)=>`<div class="part ${p.rej?"rej":""}" data-i="${i}" style="animation-delay:${i*.3}s">${icon(k,p)}<b>${p.n}</b><small>${p.m||"universal"} · nivel ${p.t}</small></div>`).join("")}</div>`:"")}
else if(S.ph=="sell")h=hud()+`<div class="row"><div class="bob">${face(c,S.mood)}</div><div class="bub">${S.msg}</div></div><p>Tu PC (costo ${$(cost())}) · bonus rapidez +${S.bonus}</p>`+(S.counter?`<button class="btn" onclick="sold(S.counter)">Aceptar ${$(S.counter)}</button><button class="btn alt" onclick="bang('Entonces no hay trato…')">Rechazar</button>`:`<div class="price" id="pr">${$(S.price)}</div><div id="hint" style="text-align:center;font-size:18px">${hintTxt()}</div><input type="range" min="${Math.round(cost()*.6)}" max="${Math.round(cost()*2.6)}" step="5" value="${S.price}" oninput="S.price=+this.value;Q('#pr').textContent='$'+Math.round(this.value).toLocaleString('es-AR');Q('#hint').textContent=hintTxt()"><button class="btn" onclick="offer()">💸 OFRECER</button>`);
else if(S.ph=="res"){const nx=CS[(CI+1)%CS.length].n;h=hud()+`<div class="row"><div class="bob">${face(c,"happy")}</div><div class="bub">${talk(c,"o")} 💖</div></div><h2 style="color:var(--yl)">Ganancia: ${$(S.res.pf)}</h2><p>Siguiente en la fila: <b>${nx}</b></p><button class="btn" onclick="S.lv++;CI++;lvl()">SIGUIENTE CLIENTE ▶</button>`}
else if(S.ph=="bang")h=`<div class="bangbox">${fireScene(c)}<p>${c.n}: ${S.bt}</p><p>Puntaje: <b>${$(S.score)}</b> · Mejor: ${$(S.best)}</p><button class="btn" onclick="start()">VOLVER A EMPEZAR</button></div>`;
a.innerHTML=h}
/* ===== Drag ===== */
document.addEventListener("pointerdown",e=>{const p=e.target.closest(".part");if(!p||S.ph!="build")return;audio();sfx("boing");const g=document.createElement("div");g.className="ghost";g.textContent=p.querySelector("b").textContent;g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";document.body.appendChild(g);G={g,i:+p.dataset.i,x:e.clientX,y:e.clientY,px:e.clientX,mv:0}});
document.addEventListener("pointermove",e=>{if(!G)return;G.g.style.left=e.clientX+"px";G.g.style.top=e.clientY+"px";G.g.style.setProperty("--r",Math.max(-25,Math.min(25,(e.clientX-G.px)*2))+"deg");G.px=e.clientX;if(Math.hypot(e.clientX-G.x,e.clientY-G.y)>8)G.mv=1});
document.addEventListener("pointerup",e=>{if(!G)return;const g=G;G=null;g.g.remove();const t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest(".slot");if(!g.mv||(s&&s.dataset.k==ST[S.step][0]))place(g.i,e.clientX,e.clientY);else if(s){S.msg=`Esa ranura no. Ahora toca: <b>${ST[S.step][1]}</b>.`;S.bad=1;draw()}});
addEventListener("pointerdown",e=>{if(e.target.closest(".part"))return;burst(e.clientX,e.clientY,R(["⭐✨","💥⚡","🎉🪙","💻🔧","🧠💾","🐱🌈"]).match(/./gu),5);const r=document.createElement("div");r.className="rip";r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";document.body.appendChild(r);setTimeout(()=>r.remove(),500)},true);
draw();
</script></body></html>
